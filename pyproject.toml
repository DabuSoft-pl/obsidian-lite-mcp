[project]
name = "obsidian-lite-mcp"
dynamic = ["version"]
description = "Small MCP server that reads an Obsidian vault from disk: Obsidian-accurate links and backlinks, sections, search. No app, no dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["mcp", "obsidian", "claude", "model-context-protocol", "markdown"]

[project.urls]
Homepage = "https://github.com/DabuSoft-pl/obsidian-lite-mcp"
Issues = "https://github.com/DabuSoft-pl/obsidian-lite-mcp/issues"

[project.scripts]
obsidian-lite-mcp = "obsidian_lite_mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["obsidian_lite_mcp"]

[tool.setuptools.dynamic]
version = { attr = "obsidian_lite_mcp.__version__" }
